id: "mat4_u5_grandezas_medidas"
subject: "Matemática"
topic: "Unidade 5: Grandezas e Medidas"
grade: [4]

vocab_rules:
  - forbidden: "calcular"
    replacement: "descobrir quanto é"
  - forbidden: "determinar"
    replacement: "descobrir"
  - forbidden: "efectuar"
    replacement: "fazer"

forbidden_words:
  - "portanto"
  - "verificar"
  - "decímetro"
  - "volume"
  - "capacidade"

curriculum_notes:
  - "Comprimento: mm, cm, m, km — 1 cm=10 mm; 1 m=100 cm; 1 km=1000 m"
  - "Conversão: 2 km 170 m = 2170 m; 7460 m = 7 km 460 m"
  - "Perímetro = soma de todos os lados"
  - "Área: superfície ocupada — medir por quadrículas (1 cm de lado = 1 cm²)"
  - "Área do rectângulo: comprimento × largura"
  - "Área do quadrado: lado × lado"
  - "Massa: g, kg, tonelada — 1 kg=1000 g; 1 t=1000 kg"
  - "Conversão: 9500 kg = 9 t 500 kg"
  - "Tempo: 1 min=60 s; 1 h=60 min; 1 dia=24 h"
  - "Calcular duração com dois passos: ex. 9h40 às 10h25 → 20+25=45 min"
  - "Trimestre=3 meses; Semestre=6 meses; Quinquénio=5 anos; Década=10 anos; Século=100 anos"
  - "NÃO usar dm; NÃO usar volume ou capacidade"

local_examples:
  - "medir terreno de machamba da avó Conceição"
  - "pesar caju na balança do mercado do Sr. Cossa"
  - "horário escolar moçambicano da Xiluva"

tutor:
  constraints:
    place_value_correction: false
    max_sentence_words: 12
    distractor_strategy: "off_by_one"
  phases:
    EXPLAIN:
      max_bubbles: 3
      interaction_types: ["EXPLANATION"]
      must_end_with_confirmation: true
    TEST:
      interaction_types: ["CHIPS", "DIRECT_INPUT", "TRUE_FALSE"]
      requires_correct_answer: true
      assessment_source: "deterministic"
    FEEDBACK:
      interaction_types: ["CHIPS"]
      assessment_source: "deterministic"

rush:
  structures:
    - "Converter unidades de Comprimento (m↔cm, km↔m)"
    - "Calcular Perímetro de triângulo ou quadrilátero"
    - "Medir Área por contagem de quadrículas (em cm²)"
    - "Calcular Área do rectângulo ou quadrado com fórmula"
    - "Converter unidades de Massa (kg↔g, kg↔t)"
    - "Converter unidades de Tempo (min↔s)"
    - "Calcular duração entre dois momentos (com minutos)"
    - "Calcular hora de chegada/saída dada duração"
    - "Identificar trimestre, semestre, quinquénio, década"
    - "Problema misto com Comprimento, Área ou Massa"
  distractor_strategy: "off_by_one"
  positional_correction: false
  difficulty_range: [1, 4]
