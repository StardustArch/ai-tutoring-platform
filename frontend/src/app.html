<!DOCTYPE html>
<html lang="pt" class="light" data-theme="cerberus" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png">
		<link rel="android-chrome-192x192" sizes="192x192" href="%sveltekit.assets%/android-chrome-192x192.png">
		<link rel="android-chrome-512x512" sizes="180x180" href="%sveltekit.assets%/android-chrome-512x512.png">
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest">
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- Script corrigido -->
		<script>
	// Tema simples e direto
	const saved = localStorage.getItem('theme');
	const system = window.matchMedia('(prefers-color-scheme: dark)').matches;
	
	if (saved === 'dark' || (!saved && system)) {
		document.documentElement.classList.add('dark');
	} else {
		document.documentElement.classList.remove('dark');
	}
</script>
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
