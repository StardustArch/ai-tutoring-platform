<svg width="100%" viewBox="0 0 460 220" style="display:block;" xmlns="http://www.w3.org/2000/svg">
  <defs></defs>
  <!-- Título -->
  <text x="230" y="18" text-anchor="middle" font-size="12" font-weight="500" font-family="sans-serif" fill="#222">Fruta preferida dos alunos da turma</text>

  <!-- Área do gráfico: x=60..430, y=28..175 -->
  <!-- Grid horizontal + labels eixo Y -->
  <g font-size="10" font-family="sans-serif" fill="#555" text-anchor="end">
    <text x="52" y="178">0</text>
    <text x="52" y="163">1</text>
    <text x="52" y="148">2</text>
    <text x="52" y="133">3</text>
    <text x="52" y="118">4</text>
    <text x="52" y="103">5</text>
    <text x="52" y="88">6</text>
    <text x="52" y="73">7</text>
    <text x="52" y="58">8</text>
    <text x="52" y="43">9</text>
    <text x="52" y="28">10</text>
  </g>
  <!-- Grid lines -->
  <g stroke="#ddd" stroke-width="0.5">
    <line x1="58" y1="175" x2="430" y2="175"></line>
    <line x1="58" y1="160" x2="430" y2="160"></line>
    <line x1="58" y1="145" x2="430" y2="145"></line>
    <line x1="58" y1="130" x2="430" y2="130"></line>
    <line x1="58" y1="115" x2="430" y2="115"></line>
    <line x1="58" y1="100" x2="430" y2="100"></line>
    <line x1="58" y1="85" x2="430" y2="85"></line>
    <line x1="58" y1="70" x2="430" y2="70"></line>
    <line x1="58" y1="55" x2="430" y2="55"></line>
    <line x1="58" y1="40" x2="430" y2="40"></line>
    <line x1="58" y1="25" x2="430" y2="25"></line>
  </g>
  <!-- Eixos -->
  <line x1="58" y1="25" x2="58" y2="175" stroke="#222" stroke-width="1"></line>
  <line x1="58" y1="175" x2="430" y2="175" stroke="#222" stroke-width="1"></line>

  <!-- Barras: escala 1 unidade = 15px. base y=175 -->
  <!-- Manga: 10 → h=150, y=25 -->
  <rect x="88" y="25" width="55" height="150" fill="#D4A96A" stroke="#B8884A" stroke-width="0.5"></rect>
  <!-- Papaia: 6 → h=90, y=85 -->
  <rect x="181" y="85" width="55" height="90" fill="#D4A96A" stroke="#B8884A" stroke-width="0.5"></rect>
  <!-- Laranja: 8 → h=120, y=55 -->
  <rect x="274" y="55" width="55" height="120" fill="#D4A96A" stroke="#B8884A" stroke-width="0.5"></rect>
  <!-- Banana: 4 → h=60, y=115 -->
  <rect x="367" y="115" width="55" height="60" fill="#D4A96A" stroke="#B8884A" stroke-width="0.5"></rect>

  <!-- Labels eixo X -->
  <g font-size="10" font-family="sans-serif" fill="#222" text-anchor="middle">
    <text x="115" y="190">Manga</text>
    <text x="208" y="190">Papaia</text>
    <text x="301" y="190">Laranja</text>
    <text x="394" y="190">Banana</text>
  </g>

  <!-- Label eixo Y -->
  <text transform="rotate(-90)" x="-100" y="14" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#555">Número de alunos</text>
  <!-- Label eixo X -->
  <text x="244" y="208" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#555">Fruta</text>
</svg>