<svg width="100%" viewBox="0 0 680 180" style="display:block;" xmlns="http://www.w3.org/2000/svg">
  <!-- A: Equilátero -->
  <g transform="translate(100,140)">
    <polygon points="0,0 80,0 40,-69" fill="none" stroke="#222" stroke-width="1.5"></polygon>

    <!-- ticks corrigidos (perpendiculares aos lados) -->
    <!-- base -->
    <line x1="40" y1="-4" x2="40" y2="4" stroke="#222" stroke-width="1.5"/>
    <!-- lado esquerdo -->
    <line x1="16" y1="-38.5" x2="24" y2="-30.5" stroke="#222" stroke-width="1.5" />
    <!-- lado direito -->
    <line x1="65" y1="-37" x2="57" y2="-28" stroke="#222" stroke-width="1.5"></line>
    
    <text x="40" y="16" text-anchor="middle" font-size="10" fill="#555">5 cm</text>
    <text x="14" y="-30" text-anchor="end" font-size="10" fill="#555">5 cm</text>
    <text x="66" y="-30" font-size="10" fill="#555">5 cm</text>
  </g>
  <text x="140" y="166" text-anchor="middle" font-size="11" fill="#222">A — equilátero</text>

  <!-- B: Isósceles -->
  <g transform="translate(310,140)">
    <polygon points="0,0 90,0 45,-60" fill="none" stroke="#222" stroke-width="1.5"></polygon>

    <!-- base -->
    <text x="45" y="16" text-anchor="middle" font-size="10" fill="#555">6 cm</text>

    <!-- ticks duplos corrigidos -->
    <!-- lado esquerdo -->
    <line x1="19.5" y1="-33" x2="25.5" y2="-27" stroke="#222" stroke-width="1.5" />
    <line x1="21.5" y1="-35" x2="27.5" y2="-29" stroke="#222" stroke-width="1.5" />

    <!-- lado direito -->
    <line x1="65" y1="-26" x2="72" y2="-32" stroke="#222" stroke-width="1.5"/>
    <line x1="63" y1="-28" x2="70" y2="-34" stroke="#222" stroke-width="1.5"/>

    <text x="14" y="-28" text-anchor="end" font-size="10" fill="#555">4 cm</text>
    <text x="76" y="-28" font-size="10" fill="#555">4 cm</text>
  </g>
  <text x="355" y="166" text-anchor="middle" font-size="11" fill="#222">B — isósceles</text>

  <!-- C: Escaleno -->
  <g transform="translate(510,140)">
    <polygon points="0,0 110,0 20,-55" fill="none" stroke="#222" stroke-width="1.5"></polygon>
    <text x="55" y="16" text-anchor="middle" font-size="10" fill="#555">7 cm</text>
    <text x="4" y="-28" text-anchor="end" font-size="10" fill="#555">3 cm</text>
    <text x="74" y="-24" font-size="10" fill="#555">5 cm</text>
  </g>
  <text x="565" y="166" text-anchor="middle" font-size="11" fill="#222">C — escaleno</text>
</svg>
