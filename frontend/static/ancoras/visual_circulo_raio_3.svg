<svg width="100%" viewBox="0 0 200 200" style="display:block;" xmlns="http://www.w3.org/2000/svg">

  <!-- Círculo 3: raio=7cm, 4 pontos A B C D no bordo -->
  <g transform="translate(100,105)">
    <circle r="72" fill="none" stroke="#222" stroke-width="1.5"></circle>
    <circle r="3" fill="#222"></circle>
    <text x="4" y="-4" font-size="11" font-family="sans-serif" fill="#222">O</text>
    <!-- raio para cima -->
    <line x1="0" y1="0" x2="0" y2="-72" stroke="#222" stroke-width="1.2" stroke-dasharray="3,2"></line>
    <text x="6" y="-36" font-size="10" font-family="sans-serif" fill="#222">7 cm</text>
    <!-- 4 pontos no bordo -->
    <circle cx="0" cy="-72" r="3" fill="#222"></circle>
    <text x="6" y="-76" font-size="11" font-family="sans-serif" fill="#222">A</text>
    <circle cx="72" cy="0" r="3" fill="#222"></circle>
    <text x="76" y="4" font-size="11" font-family="sans-serif" fill="#222">B</text>
    <circle cx="0" cy="72" r="3" fill="#222"></circle>
    <text x="6" y="86" font-size="11" font-family="sans-serif" fill="#222">C</text>
    <circle cx="-72" cy="0" r="3" fill="#222"></circle>
    <text x="-86" y="4" font-size="11" font-family="sans-serif" fill="#222">D</text>
  </g>
</svg>