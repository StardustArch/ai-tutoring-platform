services:

  # 1. Base de Dados (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: tcc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      - TZ=Africa/Maputo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend (NestJS)
  backend:
    build: ./backend
    container_name: tcc_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - TZ=Africa/Maputo
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # 3. Serviço de IA (FastAPI)
  api:
    build: ./api
    container_name: tcc_api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # 4. Frontend (SvelteKit)
  frontend:
    build: ./frontend
    container_name: tcc_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
